interface:
  display_name: "GEOFlow"
  short_description: "Manage GEOFlow content and theme drafts by CLI"
  default_prompt: "Use $geoflow with the selected CLI profile. Discover identity and capabilities, preserve versions and receipts, verify results, and report unavailable operations."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
